<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAYanime Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />

<style>
  html, body {
    direction: ltr !important;
    text-align: left !important;
  }

  :root {
    --primary: #2c3e50;
    --secondary: #8e44ad;
    --light: #ecf0f1;
    --dark: #2c3e50;
    --accent: #e74c3c;
    --success: #27ae60;
    --warning: #f1c40f;
    --save-blue: #3498db;
    --season-bg: rgba(52, 152, 219, 0.9);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--dark) !important; /* كل النصوص تكون دارك افتراضياً */
  }

  /* لكن نخلي الألوان الملونة زي البنفسجي والأزرق والأحمر بدون تغيير */
  .status-watching, .status-completed, .status-plan,
  .save-btn, .add-note-btn, .remove-note-btn,
  header h1, header p {
    color: unset !important;
  }
  header h1 {
    color: white !important;
    text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
  }
  header p {
    color: rgba(255, 255, 255, 0.9) !important;
  }
  .save-btn, .add-note-btn {
    color: white !important;
  }

  body {
    background-color: var(--light);
    min-height: 100vh;
    padding: 20px;
    background-image: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    overflow-x: hidden;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 3.5rem;
  }

  header p {
    font-size: 1.2rem;
  }

  .card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    transition: transform 0.4s ease, box-shadow 0.4s ease, background-color 0.4s ease;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    background-color: rgba(255, 255, 255, 0.95);
  }

  .card-header {
    background-color: var(--primary);
    color: white;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-body {
    padding: 25px;
  }

  .anime-form {
    display: grid;
    gap: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-weight: 700;
    font-size: 1rem;
    color: var(--dark) !important;
  }

  input,
  select,
  textarea {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1.1rem;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
    background-color: rgba(255, 255, 255, 0.9);
    color: var(--dark) !important;
  }

  input[type="file"] {
    padding: 3px;
    font-size: 1.1rem;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.3), 0 0 10px rgba(44, 62, 80, 0.2);
  }

  .add-note-btn,
  .remove-note-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.5rem;
    border: none;
    cursor: pointer;
    align-self: flex-end;
    transition: background-color 0.3s ease;
  }

  .add-note-btn {
    background-color: var(--save-blue);
    color: white !important;
  }

  .add-note-btn:hover {
    background-color: #2980b9;
  }

  .remove-note-btn {
    background-color: var(--accent);
    margin-left: 10px;
    color: white !important;
  }

  .remove-note-btn:hover {
    background-color: #c0392b;
  }

  .form-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
  }

  .save-btn,
  .cancel-btn {
    border: none;
    padding: 16px 40px;
    cursor: pointer;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: 700;
    text-transform: uppercase;
    transition: background-color 0.4s ease, transform 0.3s ease-in-out, box-shadow 0.4s ease;
    width: 200px;
  }

  .save-btn {
    background-color: var(--save-blue);
    color: white !important;
  }

  .save-btn:hover {
    background-color: #2980b9;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
  }

  .cancel-btn {
    background-color: #ccc;
    color: #333 !important;
  }

  .cancel-btn.hidden {
    display: none;
  }

  .cancel-btn:hover {
    background-color: #b3b3b3;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  }

  .save-btn:active,
  .cancel-btn:active {
    transform: translateY(0);
  }

  .anime-list {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 25px;
  }

  .anime-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    opacity: 0;
    animation: scaleUp 0.8s ease-out forwards;
    min-height: 450px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
  }

  .anime-card:hover {
    transform: scale(1.05);
    opacity: 0.95;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
  }

  @keyframes scaleUp {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .anime-image {
    height: 200px;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .anime-status {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 12px;
    border-radius: 25px;
    font-size: 0.9rem;
    font-weight: 700;
    color: white !important;
    background: var(--primary);
  }

  .status-watching {
    background: var(--primary);
  }

  .status-completed {
    background: var(--success);
  }

  .status-plan {
    background: var(--warning);
  }

  .anime-info {
    padding: 20px;
    flex-grow: 1;
  }

  .anime-title {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--dark) !important;
  }

  .anime-details {
    font-size: 1rem;
    color: #666 !important;
    margin-bottom: 12px;
  }

  .anime-description {
    font-size: 1rem;
    color: #555 !important;
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    max-height: 4.5em;
  }

  .anime-actions {
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    background-color: rgba(236, 240, 241, 0.9);
    border-top: 2px solid #eee;
    margin-top: auto;
  }

  .action-btn {
    background: none;
    border: none;
    font-size: 1rem;
    color: var(--primary);
    cursor: pointer;
    padding: 8px 15px;
    border-radius: 6px;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  .action-btn:hover {
    background-color: rgba(44, 62, 80, 0.15);
    transform: translateY(-1px);
  }

  .tab-nav {
    display: flex;
    margin-top: 20px;
    margin-bottom: 10px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
  }

  .tab-button {
    flex: 1;
    padding: 18px;
    background: white;
    border: none;
    cursor: pointer;
    font-weight: 700;
    color: #666;
    transition: all 0.4s ease;
    border-bottom: 4px solid transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    position: relative;
    user-select: none;
  }

  .tab-button:hover {
    background-color: rgba(255, 255, 255, 0.95);
  }

  .tab-button.active {
    background-color: white;
    color: var(--primary);
    border-bottom-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 0 10px rgba(44, 62, 80, 0.2);
  }

  .anime-count {
    font-size: 1rem;
    color: #666;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    padding: 4px 8px;
    border-radius: 12px;
  }

  .tab-button:hover .anime-count {
    opacity: 0.7;
    transform: scale(1.1);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .no-anime {
    text-align: center;
    padding: 50px;
    color: #666;
    font-size: 1.3rem;
  }

  .search-container {
    margin-bottom: 30px;
  }

  .search-input {
    width: 100%;
    padding: 18px;
    border-radius: 30px;
    border: none;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    font-size: 1.1rem;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
  }

  .search-input:focus {
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    transform: scale(1.02);
  }

  .footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px 0;
  }

  .made-by {
    font-size: 0.8rem;
    color: white;
    opacity: 0.4;
    font-weight: 600;
    text-transform: none;
    font-family: 'Cairo', sans-serif;
  }

  /* أنيميشن للنوت الجديدة */
  .form-group.new-note {
    animation: noteAppear 0.5s ease-out forwards;
  }

  @keyframes noteAppear {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* أنيميشن للحذف */
  .form-group.removing {
    animation: noteDisappear 0.5s ease-out forwards;
  }

  @keyframes noteDisappear {
    from {
      opacity: 1;
      transform: scale(1);
    }
    to {
      opacity: 0;
      transform: scale(0.8);
    }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>RAYanime Tracker</h1>
      <p>Keep track of your favorite anime easily</p>
    </header>

    <div class="card">
      <div class="card-header">
        <h2>Add New Anime</h2>
      </div>
      <div class="card-body">
        <form id="anime-form" class="anime-form" autocomplete="off">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="form-group">
            <label for="image">Image Upload</label>
            <input type="file" id="image" name="image" accept="image/*" />
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
              <option value="watching">Watching</option>
              <option value="completed">Completed</option>
              <option value="plan">Plan to Watch</option>
            </select>
          </div>
          <div class="form-group">
            <label for="rating">Rating (1-10)</label>
            <input
              type="number"
              id="rating"
              name="rating"
              min="1"
              max="10"
              step="1"
              value="5"
              required
            />
          </div>
          <div class="form-group">
            <label for="description">Description / Notes</label>
            <textarea id="description" name="description" rows="3" placeholder="Add note"></textarea>
          </div>
          <div id="notes-container"></div>
          <button type="button" id="add-note-btn" class="add-note-btn" title="Add Note">+</button>

          <div class="form-actions">
            <button type="submit" class="save-btn">Save Anime</button>
            <button type="button" id="cancel-btn" class="cancel-btn hidden">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <nav class="tab-nav">
      <button class="tab-button active" data-tab="all">
        All <span id="count-all" class="anime-count">0</span>
      </button>
      <button class="tab-button" data-tab="watching">
        Watching <span id="count-watching" class="anime-count">0</span>
      </button>
      <button class="tab-button" data-tab="completed">
        Completed <span id="count-completed" class="anime-count">0</span>
      </button>
      <button class="tab-button" data-tab="plan">
        Plan to Watch <span id="count-plan" class="anime-count">0</span>
      </button>
    </nav>

    <div id="anime-list" class="anime-list"></div>

    <div class="footer">
      <p class="made-by">Made with ❤️ by Ray</p>
    </div>
  </div>

<script>
  const animeForm = document.getElementById('anime-form');
  const animeList = document.getElementById('anime-list');
  const searchInput = document.createElement('input');
  const tabs = document.querySelectorAll('.tab-button');
  const notesContainer = document.getElementById('notes-container');
  const addNoteBtn = document.getElementById('add-note-btn');
  const cancelBtn = document.getElementById('cancel-btn');

  let animeData = JSON.parse(localStorage.getItem('animeData')) || [];
  let editingIndex = -1;

  // Search input on top of list
  searchInput.type = 'search';
  searchInput.placeholder = 'Search anime...';
  searchInput.classList.add('search-input');
  searchInput.style.marginBottom = '30px';
  document.querySelector('.container').insertBefore(searchInput, animeList);

  // Render anime cards based on filter and search
  function renderAnime(filter = 'all', search = '') {
    animeList.innerHTML = '';

    let filteredAnime = animeData;

    if (filter !== 'all') {
      filteredAnime = filteredAnime.filter(a => a.status === filter);
    }

    if (search.trim() !== '') {
      filteredAnime = filteredAnime.filter(a =>
        a.title.toLowerCase().includes(search.toLowerCase())
      );
    }

    if (filteredAnime.length === 0) {
      animeList.innerHTML = `<p class="no-anime">No anime found.</p>`;
      updateCounts();
      return;
    }

    filteredAnime.forEach((anime, index) => {
      const card = document.createElement('div');
      card.classList.add('anime-card');

      // صورة الأنمي
      if (anime.imageDataUrl) {
        const imgDiv = document.createElement('div');
        imgDiv.classList.add('anime-image');
        imgDiv.style.backgroundImage = `url(${anime.imageDataUrl})`;

        const statusLabel = document.createElement('span');
        statusLabel.classList.add('anime-status', `status-${anime.status}`);
        statusLabel.textContent = capitalize(anime.status);
        imgDiv.appendChild(statusLabel);

        card.appendChild(imgDiv);
      }

      const infoDiv = document.createElement('div');
      infoDiv.classList.add('anime-info');

      const titleH3 = document.createElement('h3');
      titleH3.classList.add('anime-title');
      titleH3.textContent = anime.title;
      infoDiv.appendChild(titleH3);

      const ratingP = document.createElement('p');
      ratingP.classList.add('anime-details');
      ratingP.textContent = `Rating: ${anime.rating}/10`;
      infoDiv.appendChild(ratingP);

      const descP = document.createElement('p');
      descP.classList.add('anime-description');
      descP.textContent = anime.description || '';
      infoDiv.appendChild(descP);

      if (anime.notes && anime.notes.length > 0) {
        const notesDiv = document.createElement('div');
        notesDiv.style.marginTop = '10px';
        anime.notes.forEach((note, idx) => {
          const noteSpan = document.createElement('span');
          noteSpan.style.display = 'block';
          noteSpan.style.fontWeight = '600';
          noteSpan.textContent = `S${idx + 2} NOTE: ${note}`;
          notesDiv.appendChild(noteSpan);
        });
        infoDiv.appendChild(notesDiv);
      }

      card.appendChild(infoDiv);

      const actionsDiv = document.createElement('div');
      actionsDiv.classList.add('anime-actions');

      const editBtn = document.createElement('button');
      editBtn.classList.add('action-btn', 'edit-btn');
      editBtn.textContent = 'Edit';
      editBtn.dataset.index = animeData.indexOf(anime);
      actionsDiv.appendChild(editBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.classList.add('action-btn', 'delete-btn');
      deleteBtn.textContent = 'Delete';
      deleteBtn.dataset.index = animeData.indexOf(anime);
      actionsDiv.appendChild(deleteBtn);

      card.appendChild(actionsDiv);

      animeList.appendChild(card);
    });

    updateCounts();
  }

  function updateCounts() {
    document.getElementById('count-all').textContent = animeData.length;
    document.getElementById('count-watching').textContent = animeData.filter(a => a.status === 'watching').length;
    document.getElementById('count-completed').textContent = animeData.filter(a => a.status === 'completed').length;
    document.getElementById('count-plan').textContent = animeData.filter(a => a.status === 'plan').length;
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  // Tabs switching
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderAnime(tab.dataset.tab, searchInput.value);
    });
  });

  // Notes system

  function getNoteCount() {
    return notesContainer.querySelectorAll('.note-group').length;
  }

  function createNoteGroup(number, value = '') {
    const noteGroup = document.createElement('div');
    noteGroup.classList.add('form-group', 'note-group', 'new-note');

    const label = document.createElement('label');
    label.textContent = `S${number} NOTE`;

    const input = document.createElement('input');
    input.type = 'text';
    input.name = 'notes[]';
    input.placeholder = `Enter S${number} note`;
    input.value = value;

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.classList.add('remove-note-btn');
    removeBtn.title = 'Remove note';
    removeBtn.innerHTML = '&times;';

    removeBtn.addEventListener('click', () => {
      noteGroup.classList.add('removing');
      setTimeout(() => {
        noteGroup.remove();
        updateNoteLabels();
      }, 500);
    });

    noteGroup.appendChild(label);
    noteGroup.appendChild(input);
    noteGroup.appendChild(removeBtn);

    return noteGroup;
  }

  function updateNoteLabels() {
    const notes = notesContainer.querySelectorAll('.note-group');
    notes.forEach((noteGroup, index) => {
      const label = noteGroup.querySelector('label');
      label.textContent = `S${index + 2} NOTE`;
      const input = noteGroup.querySelector('input');
      input.placeholder = `Enter S${index + 2} note`;
    });
  }

  function initNotes() {
    notesContainer.innerHTML = '';
    // نبدأ بواحدة S2 NOTE فقط
    const firstNote = createNoteGroup(2);
    notesContainer.appendChild(firstNote);
  }

  addNoteBtn.addEventListener('click', () => {
    let count = getNoteCount();
    if (count >= 9) return; // أقصى 9 نوت (S2 إلى S10)

    const newNote = createNoteGroup(count + 2);
    notesContainer.appendChild(newNote);
  });

  // Form cancel button
  cancelBtn.addEventListener('click', () => {
    animeForm.reset();
    cancelBtn.classList.add('hidden');
    editingIndex = -1;
    initNotes();
  });

  // Save anime form submit
  animeForm.addEventListener('submit', e => {
    e.preventDefault();

    const formData = new FormData(animeForm);

    // Validate rating between 1-10
    let rating = parseInt(formData.get('rating'));
    if (isNaN(rating) || rating < 1) rating = 1;
    if (rating > 10) rating = 10;

    if (!formData.get('title').trim()) {
      alert('Please enter an anime title.');
      return;
    }

    function saveAnimeWithImage(imageDataUrl) {
      const newAnime = {
        title: formData.get('title').trim(),
        imageDataUrl: imageDataUrl || (editingIndex !== -1 ? animeData[editingIndex].imageDataUrl : ''),
        status: formData.get('status'),
        rating: rating,
        description: formData.get('description').trim(),
        notes: formData.getAll('notes[]').map(note => note.trim()).filter(note => note !== ''),
      };

      if (editingIndex === -1) {
        animeData.push(newAnime);
      } else {
        animeData[editingIndex] = newAnime;
        editingIndex = -1;
      }

      localStorage.setItem('animeData', JSON.stringify(animeData));
      animeForm.reset();
      cancelBtn.classList.add('hidden');
      initNotes();
      renderAnime(getActiveTab(), searchInput.value);
    }

    const imageFile = animeForm.image.files[0];
    if (imageFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveAnimeWithImage(e.target.result);
      };
      reader.readAsDataURL(imageFile);
    } else {
      saveAnimeWithImage('');
    }
  });

  // Get active tab
  function getActiveTab() {
    const activeTab = document.querySelector('.tab-button.active');
    return activeTab ? activeTab.dataset.tab : 'all';
  }

  // Edit and delete buttons in anime list
  animeList.addEventListener('click', e => {
    if (e.target.classList.contains('edit-btn')) {
      const index = parseInt(e.target.dataset.index);
      startEditAnime(index);
    } else if (e.target.classList.contains('delete-btn')) {
      const index = parseInt(e.target.dataset.index);
      if (confirm('Are you sure you want to delete this anime?')) {
        animeData.splice(index, 1);
        localStorage.setItem('animeData', JSON.stringify(animeData));
        renderAnime(getActiveTab(), searchInput.value);
      }
    }
  });

  function startEditAnime(index) {
    const anime = animeData[index];
    if (!anime) return;

    editingIndex = index;
    animeForm.title.value = anime.title;

    // لا نمسح قيمة الملف، نتركها فارغة لتجنب حذف الصورة إذا ما غيرنا الملف
    animeForm.image.value = '';

    animeForm.status.value = anime.status;
    animeForm.rating.value = anime.rating;
    animeForm.description.value = anime.description;

    // النوتات
    notesContainer.innerHTML = '';
    if (anime.notes && anime.notes.length > 0) {
      anime.notes.forEach((note, i) => {
        const noteGroup = createNoteGroup(i + 2, note);
        notesContainer.appendChild(noteGroup);
      });
    } else {
      initNotes();
    }

    cancelBtn.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Search input event
  searchInput.addEventListener('input', () => {
    renderAnime(getActiveTab(), searchInput.value);
  });

  // Validate rating input live
  animeForm.rating.addEventListener('input', () => {
    let val = parseInt(animeForm.rating.value);
    if (isNaN(val) || val < 1) {
      animeForm.rating.value = 1;
    } else if (val > 10) {
      animeForm.rating.value = 10;
    }
  });

  // Init notes & initial render
  window.addEventListener('DOMContentLoaded', () => {
    initNotes();
    renderAnime();
  });
</script>
</body>
</html>
