<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAYanime Tracker</title>

    <!-- خط عربي Cairo من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #8e44ad;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f1c40f;
            --save-blue: #3498db;
            --season-bg: rgba(52, 152, 219, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            overflow-x: hidden;
            direction: rtl;
            text-align: right;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3.5rem;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }

        header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease, background-color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.95);
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body {
            padding: 25px;
        }

        .anime-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 700;
            font-size: 1rem;
            color: var(--dark);
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            background-color: rgba(255, 255, 255, 0.9);
        }

        input[type="file"] {
            padding: 3px;
            font-size: 1.1rem;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.3), 0 0 10px rgba(44, 62, 80, 0.2);
        }

        .add-note-btn,
        .remove-note-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            align-self: flex-end;
            transition: background-color 0.3s ease;
        }

        .add-note-btn {
            background-color: var(--save-blue);
        }

        .add-note-btn:hover {
            background-color: #2980b9;
        }

        .remove-note-btn {
            background-color: var(--accent);
            margin-left: 10px;
        }

        .remove-note-btn:hover {
            background-color: #c0392b;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .save-btn,
        .cancel-btn {
            border: none;
            padding: 16px 40px;
            cursor: pointer;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: background-color 0.4s ease, transform 0.3s ease-in-out, box-shadow 0.4s ease;
            width: 200px;
        }

        .save-btn {
            background-color: var(--save-blue);
            color: white;
        }

        .save-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .cancel-btn {
            background-color: #ccc;
            color: #333;
        }

        .cancel-btn.hidden {
            display: none;
        }

        .cancel-btn:hover {
            background-color: #b3b3b3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .save-btn:active,
        .cancel-btn:active {
            transform: translateY(0);
        }

        .anime-list {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .anime-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            opacity: 0;
            animation: scaleUp 0.8s ease-out forwards;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
        }

        .anime-card:hover {
            transform: scale(1.05);
            opacity: 0.95;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .anime-image {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .anime-status {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            background: var(--primary);
        }

        .status-watching {
            background: var(--primary);
        }

        .status-completed {
            background: var(--success);
        }

        .status-plan {
            background: var(--warning);
        }

        .anime-info {
            padding: 20px;
            flex-grow: 1;
        }

        .anime-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .anime-details {
            font-size: 1rem;
            color: #666;
            margin-bottom: 12px;
        }

        .anime-description {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-height: 4.5em;
        }

        .anime-actions {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: rgba(236, 240, 241, 0.9);
            border-top: 2px solid #eee;
            margin-top: auto;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--primary);
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .action-btn:hover {
            background-color: rgba(44, 62, 80, 0.15);
            transform: translateY(-1px);
        }

        .tab-nav {
            display: flex;
            margin-top: 20px;
            margin-bottom: 10px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .tab-button {
            flex: 1;
            padding: 18px;
            background: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            color: #666;
            transition: all 0.4s ease;
            border-bottom: 4px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            user-select: none;
        }

        .tab-button:hover {
            background-color: rgba(255, 255, 255, 0.95);
        }

        .tab-button.active {
            background-color: white;
            color: var(--primary);
            border-bottom-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(44, 62, 80, 0.2);
        }

        .anime-count {
            font-size: 1rem;
            color: #666;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .tab-button:hover .anime-count {
            opacity: 0.7;
            transform: scale(1.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .no-anime {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.3rem;
        }

        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 18px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            font-size: 1.1rem;
            transition: box-shadow 0.4s ease, transform 0.4s ease;
        }

        .search-input:focus {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
        }

        .made-by {
            font-size: 0.8rem;
            color: white;
            opacity: 0.4;
            font-weight: 600;
            text-transform: none;
            font-family: 'Cairo', sans-serif;
        }

        /* أنيميشن للنوت الجديدة */
        .form-group.new-note {
            animation: noteAppear 0.5s ease-out forwards;
        }

        @keyframes noteAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* أنيميشن للحذف */
        .form-group.removing {
            animation: noteDisappear 0.5s ease-out forwards;
        }

        @keyframes noteDisappear {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RAYanime Tracker</h1>
            <p>Keep track of your favorite anime easily</p>
        </header>

        <div class="card">
            <div class="card-header">
                <h2>Add New Anime</h2>
            </div>
            <div class="card-body">
                <form id="anime-form" class="anime-form" autocomplete="off">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required />
                    </div>
                    <div class="form-group">
                        <label for="image">Image Upload</label>
                        <input type="file" id="image" name="image" accept="image/*" />
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="watching">Watching</option>
                            <option value="completed">Completed</option>
                            <option value="plan">Plan to Watch</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rating">Rating (1-10)</label>
                        <input
                            type="number"
                            id="rating"
                            name="rating"
                            min="1"
                            max="10"
                            step="1"
                            value="5"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label for="description">Notes</label>
                        <textarea id="description" name="description" rows="3" placeholder="Add note"></textarea>
                    </div>
                    <div id="notes-container">
                        <div class="form-group note-group">
                            <label>S1 Note</label>
                            <input type="text" name="notes[]" placeholder="Add note" />
                            <button type="button" class="remove-note-btn" title="Remove note">&times;</button>
                        </div>
                    </div>
                    <button type="button" id="add-note-btn" class="add-note-btn" title="Add Note">+</button>

                    <div class="form-actions">
                        <button type="submit" class="save-btn">Save Anime</button>
                        <button type="reset" class="cancel-btn hidden">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="tab-nav">
            <button class="tab-button active" data-tab="all">All Anime <span class="anime-count" id="count-all">0</span></button>
            <button class="tab-button" data-tab="watching">Watching <span class="anime-count" id="count-watching">0</span></button>
            <button class="tab-button" data-tab="completed">Completed <span class="anime-count" id="count-completed">0</span></button>
            <button class="tab-button" data-tab="plan">Plan to Watch <span class="anime-count" id="count-plan">0</span></button>
        </div>

        <div class="search-container">
            <input
                type="search"
                id="search-input"
                class="search-input"
                placeholder="Search anime..."
                autocomplete="off"
            />
        </div>

        <div class="anime-list" id="anime-list">
            <!-- Anime cards will be rendered here -->
        </div>

        <div class="footer">
            <p class="made-by">Made By RAY</p>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab-button');
        const animeList = document.getElementById('anime-list');
        const animeForm = document.getElementById('anime-form');
        const addNoteBtn = document.getElementById('add-note-btn');
        const notesContainer = document.getElementById('notes-container');
        const searchInput = document.getElementById('search-input');
        const cancelBtn = animeForm.querySelector('.cancel-btn');

        let animeData = JSON.parse(localStorage.getItem('animeData')) || [];
        let editingIndex = -1;

        // Helper: Capitalize first letter of each word (for Made By RAY format)
        function capitalizeWords(str) {
            return str
                .split(' ')
                .map(word => {
                    if (word.toUpperCase() === 'RAY') return 'RAY'; // keep RAY capital
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                })
                .join(' ');
        }

        // Render anime cards based on filter and search
        function renderAnime(filter = 'all', searchTerm = '') {
            animeList.innerHTML = '';
            let filteredData;

            if (filter === 'all') {
                filteredData = animeData;
            } else {
                filteredData = animeData.filter((anime) => anime.status === filter);
            }

            if (searchTerm.trim() !== '') {
                filteredData = filteredData.filter((anime) =>
                    anime.title.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filteredData.length === 0) {
                animeList.innerHTML = `<p class="no-anime">No anime found.</p>`;
                updateCounts();
                return;
            }

            filteredData.forEach((anime, index) => {
                const card = document.createElement('div');
                card.classList.add('anime-card');

                // الصورة تكون من dataUrl لو موجودة أو افتراضية
                const imgSrc = anime.imageDataUrl || 'https://via.placeholder.com/400x200?text=No+Image';

                card.innerHTML = `
                    <div class="anime-image" style="background-image: url('${imgSrc}')">
                        <div class="anime-status status-${anime.status}">${capitalize(anime.status)}</div>
                    </div>
                    <div class="anime-info">
                        <h3 class="anime-title">${anime.title}</h3>
                        <p class="anime-details">Rating: ${anime.rating}/10</p>
                        <p class="anime-description">${anime.description || 'No notes provided.'}</p>
                        ${
                            anime.notes && anime.notes.length
                                ? `<p><strong>Notes:</strong> ${anime.notes.join(', ')}</p>`
                                : ''
                        }
                    </div>
                    <div class="anime-actions">
                        <button class="action-btn edit-btn" data-index="${index}">Edit</button>
                        <button class="action-btn delete-btn" data-index="${index}">Delete</button>
                    </div>
                `;

                animeList.appendChild(card);
            });

            updateCounts();
        }

        // Update counts on tabs
        function updateCounts() {
            document.getElementById('count-all').textContent = animeData.length;
            document.getElementById('count-watching').textContent = animeData.filter(a => a.status === 'watching').length;
            document.getElementById('count-completed').textContent = animeData.filter(a => a.status === 'completed').length;
            document.getElementById('count-plan').textContent = animeData.filter(a => a.status === 'plan').length;
        }

        // Capitalize first letter helper
        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const filter = tab.dataset.tab;
                renderAnime(filter, searchInput.value);
            });
        });

        // Add note button
        addNoteBtn.addEventListener('click', () => {
            // Count existing notes with label Sx Note to limit max 10
            const existingNotes = notesContainer.querySelectorAll('.note-group label');
            let maxSNum = 0;
            existingNotes.forEach(label => {
                const text = label.textContent.trim();
                const match = text.match(/^S(\d+) Note$/);
                if (match) {
                    const num = parseInt(match[1]);
                    if (num > maxSNum) maxSNum = num;
                }
            });

            if (maxSNum >= 10) return; // max reached

            const nextNum = maxSNum + 1;

            const noteGroup = document.createElement('div');
            noteGroup.classList.add('form-group', 'note-group', 'new-note');

            const label = document.createElement('label');
            label.textContent = `S${nextNum} Note`;

            const input = document.createElement('input');
            input.type = 'text';
            input.name = 'notes[]';
            input.placeholder = 'Add note';

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.classList.add('remove-note-btn');
            removeBtn.title = 'Remove note';
            removeBtn.innerHTML = '&times;';

            removeBtn.addEventListener('click', () => {
                noteGroup.classList.add('removing');
                setTimeout(() => noteGroup.remove(), 500);
            });

            noteGroup.appendChild(label);
            noteGroup.appendChild(input);
            noteGroup.appendChild(removeBtn);

            notesContainer.appendChild(noteGroup);
        });

        // Remove note buttons for existing notes
        notesContainer.querySelectorAll('.remove-note-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const noteGroup = e.target.closest('.note-group');
                noteGroup.classList.add('removing');
                setTimeout(() => noteGroup.remove(), 500);
            });
        });

        // Clear form and cancel button logic
        cancelBtn.addEventListener('click', () => {
            animeForm.reset();
            cancelBtn.classList.add('hidden');
            editingIndex = -1;
            // Reset notes container to default S1 Note
            notesContainer.innerHTML = '';
            const noteGroup = document.createElement('div');
            noteGroup.classList.add('form-group', 'note-group');

            const label = document.createElement('label');
            label.textContent = 'S1 Note';

            const input = document.createElement('input');
            input.type = 'text';
            input.name = 'notes[]';
            input.placeholder = 'Add note';

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.classList.add('remove-note-btn');
            removeBtn.title = 'Remove note';
            removeBtn.innerHTML = '&times;';

            removeBtn.addEventListener('click', () => {
                noteGroup.classList.add('removing');
                setTimeout(() => noteGroup.remove(), 500);
            });

            noteGroup.appendChild(label);
            noteGroup.appendChild(input);
            noteGroup.appendChild(removeBtn);

            notesContainer.appendChild(noteGroup);
        });

        // Save anime
        animeForm.addEventListener('submit', e => {
            e.preventDefault();

            const formData = new FormData(animeForm);

            // Validate rating between 1 and 10
            let rating = parseInt(formData.get('rating'));
            if (isNaN(rating) || rating < 1) rating = 1;
            if (rating > 10) rating = 10;

            // Image file from input
            const imageFile = animeForm.image.files[0];

            if (!formData.get('title').trim()) {
                alert('Please enter an anime title.');
                return;
            }

            function saveAnimeWithImage(imageDataUrl) {
                const newAnime = {
                    title: formData.get('title').trim(),
                    imageDataUrl: imageDataUrl || '',
                    status: formData.get('status'),
                    rating: rating,
                    description: formData.get('description').trim(),
                    notes: formData.getAll('notes[]').map(note => note.trim()).filter(note => note !== ''),
                };

                if (editingIndex === -1) {
                    animeData.push(newAnime);
                } else {
                    animeData[editingIndex] = newAnime;
                    editingIndex = -1;
                }

                localStorage.setItem('animeData', JSON.stringify(animeData));
                animeForm.reset();
                cancelBtn.classList.add('hidden');

                // Reset notes container to default S1 Note after save
                notesContainer.innerHTML = '';
                const noteGroup = document.createElement('div');
                noteGroup.classList.add('form-group', 'note-group');

                const label = document.createElement('label');
                label.textContent = 'S1 Note';

                const input = document.createElement('input');
                input.type = 'text';
                input.name = 'notes[]';
                input.placeholder = 'Add note';

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.classList.add('remove-note-btn');
                removeBtn.title = 'Remove note';
                removeBtn.innerHTML = '&times;';

                removeBtn.addEventListener('click', () => {
                    noteGroup.classList.add('removing');
                    setTimeout(() => noteGroup.remove(), 500);
                });

                noteGroup.appendChild(label);
                noteGroup.appendChild(input);
                noteGroup.appendChild(removeBtn);

                notesContainer.appendChild(noteGroup);

                renderAnime(getActiveTab(), searchInput.value);
            }

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveAnimeWithImage(e.target.result);
                };
                reader.readAsDataURL(imageFile);
            } else {
                saveAnimeWithImage('');
            }
        });

        // Get active tab filter
        function getActiveTab() {
            const activeTab = document.querySelector('.tab-button.active');
            return activeTab ? activeTab.dataset.tab : 'all';
        }

        // Edit and Delete buttons in the anime cards
        animeList.addEventListener('click', e => {
            if (e.target.classList.contains('edit-btn')) {
                const index = parseInt(e.target.dataset.index);
                startEditAnime(index);
            } else if (e.target.classList.contains('delete-btn')) {
                const index = parseInt(e.target.dataset.index);
                if (confirm('Are you sure you want to delete this anime?')) {
                    animeData.splice(index, 1);
                    localStorage.setItem('animeData', JSON.stringify(animeData));
                    renderAnime(getActiveTab(), searchInput.value);
                }
            }
        });

        // Start editing anime
        function startEditAnime(index) {
            const anime = animeData[index];
            if (!anime) return;

            editingIndex = index;
            animeForm.title.value = anime.title;

            // Can't set file input value, so we skip image input when editing
            // Alternatively, we could clear it
            animeForm.image.value = '';

            animeForm.status.value = anime.status;
            animeForm.rating.value = anime.rating;
            animeForm.description.value = anime.description;

            // Clear existing notes inputs
            notesContainer.innerHTML = '';

            // Add existing notes inputs
            if (anime.notes && anime.notes.length > 0) {
                anime.notes.forEach((note, i) => {
                    const noteGroup = document.createElement('div');
                    noteGroup.classList.add('form-group', 'note-group');

                    const label = document.createElement('label');
                    label.textContent = `S${i + 1} Note`;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.name = 'notes[]';
                    input.value = note;

                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.classList.add('remove-note-btn');
                    removeBtn.title = 'Remove note';
                    removeBtn.innerHTML = '&times;';

                    removeBtn.addEventListener('click', () => {
                        noteGroup.classList.add('removing');
                        setTimeout(() => noteGroup.remove(), 500);
                    });

                    noteGroup.appendChild(label);
                    noteGroup.appendChild(input);
                    noteGroup.appendChild(removeBtn);

                    notesContainer.appendChild(noteGroup);
                });
            } else {
                // If no notes, add a blank note input with S1 Note label
                const noteGroup = document.createElement('div');
                noteGroup.classList.add('form-group', 'note-group');

                const label = document.createElement('label');
                label.textContent = 'S1 Note';

                const input = document.createElement('input');
                input.type = 'text';
                input.name = 'notes[]';
                input.placeholder = 'Add note';

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.classList.add('remove-note-btn');
                removeBtn.title = 'Remove note';
                removeBtn.innerHTML = '&times;';

                removeBtn.addEventListener('click', () => {
                    noteGroup.classList.add('removing');
                    setTimeout(() => noteGroup.remove(), 500);
                });

                noteGroup.appendChild(label);
                noteGroup.appendChild(input);
                noteGroup.appendChild(removeBtn);

                notesContainer.appendChild(noteGroup);
            }

            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Search input event
        searchInput.addEventListener('input', () => {
            renderAnime(getActiveTab(), searchInput.value);
        });

        // Validate rating input to be between 1 and 10 live
        animeForm.rating.addEventListener('input', () => {
            let val = parseInt(animeForm.rating.value);
            if (isNaN(val) || val < 1) {
                animeForm.rating.value = 1;
            } else if (val > 10) {
                animeForm.rating.value = 10;
            }
        });

        // Initial render
        renderAnime();

    </script>
</body>
</html>
